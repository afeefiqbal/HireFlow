version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_job_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixbit
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_job_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixbit -d ai_job_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai_job_agent_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://pixbit:password@postgres:5432/ai_job_agent?schema=public
      JWT_SECRET: afeef_ai_job_agent_secure_jwt_secret_2026_x7k9
      API_ACCESS_TOKEN: afeef_private_dashboard_token_2026
      AI_PROVIDER: mock
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai_job_agent_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

  n8n:
    image: n8nio/n8n:latest
    container_name: ai_job_agent_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
